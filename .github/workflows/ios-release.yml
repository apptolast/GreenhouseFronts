# iOS TestFlight upload - driven by `v*` Git tags.
#
# Required GitHub Secrets:
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_KEY_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_BASE64
#   MATCH_GIT_URL
#   MATCH_PASSWORD
#   MATCH_GIT_BASIC_AUTHORIZATION
#   FASTLANE_TEAM_ID
#   FASTLANE_ITC_TEAM_ID
#
# Optional:
#   IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64

name: iOS TestFlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag/version to publish, e.g. v0.4.0'
        required: true
        type: string

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload to TestFlight
    runs-on: macos-latest
    environment: release
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Render local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          EOF

      #      - name: Optionally decode GoogleService-Info.plist
      #        env:
      #          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      #        run: |
      #          if [ -n "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
      #            echo "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > iosApp/iosApp/GoogleService-Info.plist
      #          fi

      - name: Run fastlane release_from_tag
        working-directory: iosApp
        env:
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
        run: bundle exec fastlane ios release_from_tag

      - name: Upload .ipa as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iosApp-release-${{ inputs.tag || github.ref_name }}
          path: iosApp/iosApp.ipa
          retention-days: 30
          if-no-files-found: warn
